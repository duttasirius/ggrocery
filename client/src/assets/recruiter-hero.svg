<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">GreenCart AI Grocery E-Commerce</title><desc id="desc">Recruiter overview showing grocery storefront, AI shopping assistant, seller flow and technology stack.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ecfdf5"/><stop offset="1" stop-color="#dcfce7"/></linearGradient></defs><rect width="1400" height="720" rx="36" fill="url(#bg)"/><text x="70" y="92" font-family="Arial" font-size="48" font-weight="700" fill="#14532d">🛒 GreenCart</text><text x="70" y="132" font-family="Arial" font-size="24" fill="#4b5563">AI grocery commerce • React • Express • MongoDB</text><rect x="70" y="180" width="820" height="450" rx="24" fill="#fff" stroke="#d1fae5"/><rect x="95" y="205" width="770" height="55" rx="12" fill="#f0fdf4"/><circle cx="125" cy="232" r="9" fill="#ef4444"/><circle cx="153" cy="232" r="9" fill="#f59e0b"/><circle cx="181" cy="232" r="9" fill="#22c55e"/><rect x="115" y="285" width="470" height="280" rx="18" fill="#f7fee7"/><text x="145" y="325" font-family="Arial" font-size="24" font-weight="700" fill="#166534">Fresh groceries</text><rect x="145" y="350" width="400" height="48" rx="24" fill="#fff" stroke="#bbf7d0"/><text x="165" y="381" font-family="Arial" font-size="15" fill="#6b7280">healthy breakfast...</text><rect x="145" y="420" width="115" height="95" rx="14" fill="#dcfce7"/><text x="170" y="475" font-family="Arial" font-size="17" font-weight="700" fill="#166534">🍎 Fruits</text><rect x="280" y="420" width="115" height="95" rx="14" fill="#fef3c7"/><text x="300" y="475" font-family="Arial" font-size="17" font-weight="700" fill="#92400e">🥛 Dairy</text><rect x="415" y="420" width="130" height="95" rx="14" fill="#dbeafe"/><text x="430" y="475" font-family="Arial" font-size="17" font-weight="700" fill="#1e40af">🥦 Veggies</text><rect x="610" y="285" width="225" height="280" rx="18" fill="#14532d"/><text x="635" y="325" font-family="Arial" font-size="20" font-weight="700" fill="#fff">🤖 AI Search</text><text x="635" y="360" font-family="Arial" font-size="14" fill="#bbf7d0">Natural language</text><rect x="635" y="385" width="175" height="50" rx="12" fill="#166534"/><text x="650" y="416" font-family="Arial" font-size="13" fill="#fff">“fresh fruit”</text><rect x="635" y="450" width="175" height="70" rx="12" fill="#fff"/><text x="650" y="478" font-family="Arial" font-size="13" font-weight="700" fill="#166534">Real product</text><text x="650" y="499" font-family="Arial" font-size="13" fill="#4b5563">+ add to cart</text><rect x="935" y="180" width="395" height="450" rx="24" fill="#14532d"/><text x="975" y="230" font-family="Arial" font-size="25" font-weight="700" fill="#fff">Built with</text><g font-family="Arial" font-size="17" font-weight="700"><rect x="975" y="260" width="145" height="42" rx="11" fill="#61dafb"/><text x="995" y="287" fill="#111827">React 19</text><rect x="1135" y="260" width="155" height="42" rx="11" fill="#646cff"/><text x="1155" y="287" fill="#fff">Vite</text><rect x="975" y="315" width="145" height="42" rx="11" fill="#47a248"/><text x="995" y="342" fill="#fff">MongoDB</text><rect x="1135" y="315" width="155" height="42" rx="11" fill="#000"/><text x="1155" y="342" fill="#fff">Express 5</text><rect x="975" y="370" width="145" height="42" rx="11" fill="#4285f4"/><text x="995" y="397" fill="#fff">Gemini AI</text><rect x="1135" y="370" width="155" height="42" rx="11" fill="#635bff"/><text x="1155" y="397" fill="#fff">Stripe</text><rect x="975" y="425" width="145" height="42" rx="11" fill="#3448c5"/><text x="995" y="452" fill="#fff">Cloudinary</text><rect x="1135" y="425" width="155" height="42" rx="11" fill="#764abc"/><text x="1155" y="452" fill="#fff">Redux</text></g><text x="975" y="515" font-family="Arial" font-size="16" fill="#dcfce7">Customer + Seller workflows</text><text x="975" y="545" font-family="Arial" font-size="16" fill="#dcfce7">Cart • Checkout • Orders • Reviews</text><text x="975" y="575" font-family="Arial" font-size="16" fill="#dcfce7">AI + deterministic fallback</text></svg>